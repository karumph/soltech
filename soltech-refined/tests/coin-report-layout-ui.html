<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coin report layout · sample data</title>
<link rel="stylesheet" href="/original/app.css">
<link rel="stylesheet" href="/original/scanner-editor.css">
<link rel="stylesheet" href="/original/scanner-builder.css">
<link rel="stylesheet" href="/original/scanner-findings.css">
<link rel="stylesheet" href="/original/coin-checker.css">
<link rel="stylesheet" href="/original/profile.css">
<link rel="stylesheet" href="/original/blue-glass.css">
<link rel="stylesheet" href="/original/personal-scanner.css">
<link rel="stylesheet" href="/original/soltech-identity.css">
<link rel="stylesheet" href="/original/scanner-flow.css">
<link rel="stylesheet" href="/original/scanner-customize.css">
<link rel="stylesheet" href="/original/coin-feed.css">
<link rel="stylesheet" href="/original/scanner-feed.css">
<link rel="stylesheet" href="/original/wallet-check.css">
<link rel="stylesheet" href="/original/coin-recent.css">
<link rel="stylesheet" href="/original/signals.css">
<link rel="stylesheet" href="/original/navigation-glass.css">
<link rel="stylesheet" href="/original/silver-borders.css">
<style>
body.review-host{background:#eef1f5;padding:18px 12px;font:14px/1.5 system-ui,sans-serif}
.review-controls{max-width:1180px;margin:0 auto 16px;display:grid;gap:9px}
.review-controls h1{font:650 19px/1.3 system-ui,sans-serif;letter-spacing:0}
.review-controls p{font-size:13px;color:#4f5967}
.review-row{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.review-row button{padding:8px 12px;min-height:36px;border:1px solid #adb7c5;border-radius:8px;background:#fff;font-size:13px;color:#253244}
.review-row button[aria-pressed=true]{background:#263345;color:#fff;border-color:#263345}
.review-stage{overflow:auto;padding:2px 2px 18px}
#review-frame{display:block;margin:0 auto;width:390px;max-width:none;height:850px;border:1px solid #bec7d3;border-radius:22px;background:#fff;box-shadow:0 12px 35px #26334512}
#test-summary[data-failures="0"]{color:#205a43}
#test-summary:not([data-failures="0"]){color:#8a2e40}
.review-controls details{font-size:12px}.review-controls details summary{cursor:pointer}.review-controls ol{padding-left:22px}
.sample-label{font:600 11px/1.4 system-ui,sans-serif;text-align:center;padding:7px 12px;background:#edf1f5;color:#4d5968;border-bottom:1px solid #d7dee6}
body.review-frame .app-shell{min-height:100vh}
body.review-frame .main-nav{--nav-count:5;--nav-active:0}
body.review-frame .review-link{pointer-events:none}
</style>
</head>
<body>
<script type="module">
import {resultHTML,mountChecker,mountReportLayout} from '/original/coin-checker.js';
import {mountHistoryChart} from '/original/coin-history.js';

const isFrame=new URL(location.href).searchParams.has('frame');
if(!isFrame){
 document.body.className='review-host';
 document.body.innerHTML=`<header class="review-controls"><h1>Coin report layout review</h1><p>Fictional sample data only. These controls never call a data provider or change saved history.</p><div class="review-row" aria-label="Preview width"><button data-width="390" aria-pressed="true">390px phone</button><button data-width="320" aria-pressed="false">320px phone</button><button data-width="1180" aria-pressed="false">Desktop</button></div><div class="review-row" aria-label="Sample report"><button data-scenario="ready" aria-pressed="true">Ready</button><button data-scenario="loading" aria-pressed="false">Loading</button><button data-scenario="unavailable" aria-pressed="false">Unavailable</button><button data-scenario="evm" aria-pressed="false">EVM</button><button data-scenario="long" aria-pressed="false">Long name</button><button data-action="update">Simulate incoming update</button><button data-action="report">Jump to report</button><button data-action="top">Page top</button></div><p id="test-summary" role="status">Running browser checks…</p><details><summary>Check results</summary><ol id="test-results"></ol></details></header><div class="review-stage"><iframe id="review-frame" title="Sample coin checker in a responsive preview" src="?frame=1"></iframe></div>`;
 const frame=document.querySelector('#review-frame');
 const send=data=>frame.contentWindow.postMessage({source:'coin-layout-review',...data},location.origin);
 document.addEventListener('click',event=>{
  const button=event.target.closest('button');if(!button)return;
  if(button.dataset.width){frame.style.width=button.dataset.width+'px';for(const b of document.querySelectorAll('[data-width]'))b.setAttribute('aria-pressed',String(b===button));send({action:'measure'});}
  if(button.dataset.scenario){for(const b of document.querySelectorAll('[data-scenario]'))b.setAttribute('aria-pressed',String(b===button));send({scenario:button.dataset.scenario});}
  if(button.dataset.action)send({action:button.dataset.action});
 });
 window.addEventListener('message',event=>{
  if(event.origin!==location.origin||event.source!==frame.contentWindow||event.data?.source!=='coin-layout-frame')return;
  const summary=document.querySelector('#test-summary');
  if(event.data.tests){const {passed,failed,results}=event.data.tests;summary.textContent=`${passed} passed, ${failed} failed · sample report ready`;summary.dataset.complete='true';summary.dataset.failures=String(failed);document.querySelector('#test-results').replaceChildren(...results.map(result=>{const li=document.createElement('li');li.textContent=(result.ok?'PASS — ':'FAIL — ')+result.name+(result.error?': '+result.error:'');return li;}));document.title=(failed?'FAIL':'PASS')+' · Coin report layout';}
  if(event.data.measure){summary.dataset.width=String(event.data.measure.width);summary.dataset.overflow=String(event.data.measure.overflow);}
 });
}else{
 document.body.className='review-frame';
 const icons=['<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/>','<circle cx="12" cy="12" r="9"/><path d="M14.5 8.5h-4a1.75 1.75 0 0 0 0 3.5h3a1.75 1.75 0 0 1 0 3.5h-4M12 6.5v11"/>','<path d="M4 8V4h4m8 0h4v4m0 8v4h-4m-8 0H4v-4M4 12h16"/>','<circle cx="12" cy="12" r="2"/><path d="M8 8a5.7 5.7 0 0 0 0 8m8-8a5.7 5.7 0 0 1 0 8M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14"/>','<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>'];
 document.body.innerHTML=`<div class="sample-label">Layout preview · fictional sample data</div><div class="app-shell"><header class="app-header"><a class="brand review-link" href="#"><span class="brand-mark"><img src="/original/assets/soltech-logo.png" alt=""></span>Solventir</a><nav class="main-nav" aria-label="Preview navigation"><span class="nav-glass" aria-hidden="true"></span>${['Check','Feed','Scanner','Signals','Profile'].map((label,i)=>`<a class="review-link ${i===0?'active':''}" href="#" ${i===0?'aria-current="page"':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[i]}</svg><span>${label}</span></a>`).join('')}</nav></header><main id="main"></main></div>`;
 const root=document.querySelector('#main'),sol='So11111111111111111111111111111111111111112',evm='0x4200000000000000000000000000000000000006';
 const now=Date.UTC(2026,9,15,18),hour=3600000;
 const points=Array.from({length:73},(_,i)=>({timestamp:now-(72-i)*hour,close:.00118+i*.000005+Math.sin(i/3)*.00012+Math.cos(i/8)*.00008}));
 const prices=points.map(p=>p.close);
 const ready={mint:sol,chainId:'solana',market:{status:'ready',data:{name:'Northstar',symbol:'NORTH',chainId:'solana',pair:sol,price:.00157,marketCap:1570000,fdv:1570000,liquidity:184500,volume:624000,change1h:3.42,change:14.8,buys1h:148,sells1h:102,buys:2184,sells:1763,created:now-19*hour,retrievedAt:now,dex:'Raydium',quote:'SOL',links:[],boostsActive:0}},risk:{status:'ready',data:{name:'Northstar',symbol:'NORTH',chainId:'solana',provider:'Rugcheck',level:'caution',incomplete:false,holders:2486,top10Percent:18.42,insiderAccounts:3,supply:{exact:'1000000000'},largestAccounts:[{address:sol,percent:5.4,kind:'wallet'},{address:'11111111111111111111111111111111',percent:3.2,kind:'wallet'}],controls:[{label:'Can mint more',value:'No'},{label:'Can freeze tokens',value:'No'},{label:'Metadata',value:'Mutable'}],flags:[{level:'caution',name:'Concentrated ownership',description:'Sample warning: a few reported accounts hold a notable share of supply.'}],retrievedAt:now}},listing:{status:'ready',data:{profilePaid:false,profileStatus:'not-reported',retrievedAt:now}},history:{status:'ready',data:{chainId:'solana',pair:sol,points,from:points[0].timestamp,through:points.at(-1).timestamp,observedHigh:Math.max(...prices),retrievedAt:now,interval:'hour',intervalMs:hour,rawCount:points.length}},bundles:{status:'not-connected',message:'Bundler data is not connected yet.'}};
 const clone=value=>structuredClone(value);
 function stateFor(name){
  const state=clone(ready);
  if(name==='loading')for(const key of ['market','risk','listing','history','bundles'])state[key]={status:'loading'};
  if(name==='unavailable'){for(const key of ['market','risk','listing','history'])state[key]={status:'error',message:'Sample unavailable state. Please try again later.'};state.bundles={status:'not-connected'};}
  if(name==='evm'){state.chainId='base';state.mint=evm;state.market.data.chainId='base';state.market.data.name='Base sample coin';state.market.data.symbol='BASE';state.market.data.pair=evm;state.market.data.dex='Uniswap';state.market.data.quote='WETH';state.risk.data.chainId='base';state.risk.data.provider='GoPlus';state.risk.data.insiderAccounts=null;state.history.data.chainId='base';state.history.data.pair=evm;state.bundles={status:'unsupported'};}
  if(name==='long'){state.market.data.name='Northstar Community Research and Discovery Collective';state.market.data.symbol='NORTHSTAR-LONG';}
  return state;
 }
 let emit=()=>{},current=clone(ready),scenario='ready',lookupCalls=0,storageCalls=0;
 const historyStore={getSnapshot:()=>({entries:[],persistent:false,error:null}),beginCheck:()=>({sample:true}),remember:()=>{storageCalls++;return false;},clear:()=>true,subscribe:()=>()=>{}};
 const dispose=mountChecker(root,{initialCoin:{chainId:'solana',address:sol},discover:async()=>({status:'resolved',chainIds:['base']}),historyStore,createSession:onChange=>{emit=onChange;return {lookup(){lookupCalls++;queueMicrotask(()=>onChange(clone(current)));},cancel(){},dispose(){}};}});
 const report=()=>root.querySelector('.coin-report-priority');
 const paint=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
 const publish=payload=>parent.postMessage({source:'coin-layout-frame',...payload},location.origin);
 const measure=()=>publish({measure:{width:document.documentElement.clientWidth,overflow:Math.max(0,document.documentElement.scrollWidth-document.documentElement.clientWidth)}});
 const results=[];
 function assert(ok,message){if(!ok)throw Error(message);}
 async function test(name,run){try{await run();results.push({name,ok:true});}catch(error){results.push({name,ok:false,error:error.message});}}
 function show(name){scenario=name;current=stateFor(name);emit(clone(current));const input=root.querySelector('#coin-address');input.value=current.mint;root.querySelector('.clear-address').disabled=false;}
 await paint();
 await test('Chart is visible immediately and before the market snapshot',()=>{const chart=root.querySelector('#report-panel-chart');assert(chart&&chart.getBoundingClientRect().height>0,'chart is not visible');assert(report().querySelectorAll('.price-history').length===1,'expected exactly one chart');assert(chart.compareDocumentPosition(root.querySelector('.live-market'))&Node.DOCUMENT_POSITION_FOLLOWING,'market snapshot is ahead of the chart');assert(!report().querySelector('[role="tablist"]'),'chart remains behind tabs');});
 await test('Risk warning remains above the chart',()=>assert(root.querySelector('.quick-risk').compareDocumentPosition(root.querySelector('#report-panel-chart'))&Node.DOCUMENT_POSITION_FOLLOWING,'warning is not above chart'));
 await test('Signals move below the warning on phones and remain beside the market snapshot on desktop',()=>{const mobile=matchMedia('(max-width:800px)').matches,signals=root.querySelector('.live-security'),slot=root.querySelector('.mobile-risk-signals');assert(report().querySelectorAll('.live-security').length===1,'ownership section duplicated');assert(signals.parentElement===(mobile?slot:root.querySelector('.report-key-data')),'signals are in the wrong responsive location');if(mobile){assert(root.querySelector('.quick-risk').nextElementSibling===slot,'signals do not immediately follow the warning');assert(signals.compareDocumentPosition(root.querySelector('#report-panel-chart'))&Node.DOCUMENT_POSITION_FOLLOWING,'mobile signals are below the chart');}else assert(root.querySelector('#report-panel-chart').compareDocumentPosition(signals)&Node.DOCUMENT_POSITION_FOLLOWING,'desktop signal order changed');});
 await test('Priority area has four market values and one of each ownership summary',()=>{assert(root.querySelectorAll('.check-metrics>div').length===4,'market snapshot is incomplete');for(const key of ['holders-details','insider-details','bundler-details','sniper-details'])assert(report().querySelectorAll('[data-view-key="'+key+'"]').length===1,'missing or duplicate '+key);const sniper=root.querySelector('[data-view-key="sniper-details"]');assert(sniper.querySelector('summary').textContent.includes('Unavailable'),'sniper data was invented');assert(getComputedStyle(sniper).display===(matchMedia('(max-width:800px)').matches?'block':'none'),'sniper visibility is not mobile-only');});
 await test('Secondary information starts collapsed and disconnected bundlers are explicit',()=>{assert([...root.querySelectorAll('.report-secondary>details')].every(el=>!el.open),'secondary information starts expanded');assert(root.querySelector('[data-view-key="bundler-details"] summary').textContent.includes('Not connected'),'bundle availability unclear');});
 await test('Chart exposes controls without duplicating the market-cap snapshot',()=>{assert(root.querySelector('.history-mode')&&root.querySelector('.history-scrubber'),'chart controls missing');assert(!root.querySelector('.history-current'),'duplicated current market cap');assert(root.querySelector('[data-view-key="history"] .history-high'),'chart high is not inside details');});
 await test('Incremental updates preserve open details, focus, selected range, metric and point',async()=>{const day=root.querySelector('[data-history-range="day"]');assert(!day.disabled,'sample day view unavailable');day.click();const mode=root.querySelector('.history-mode');mode.value='price';mode.dispatchEvent(new Event('change',{bubbles:true}));const slider=root.querySelector('.history-scrubber');slider.value='4';slider.dispatchEvent(new Event('input',{bubbles:true}));const selected=root.querySelector('[data-history-time]').getAttribute('datetime');const details=root.querySelector('[data-view-key="holders-details"]');details.open=true;details.querySelector('summary').focus({preventScroll:true});await Promise.resolve();emit({...clone(current),listing:{status:'ready',data:{profilePaid:true,profileStatus:'paid',retrievedAt:now+1000}}});await paint();assert(root.querySelector('[data-view-key="holders-details"]').open,'details closed');assert(document.activeElement===root.querySelector('[data-view-key="holders-details"] summary'),'focus lost');assert(root.querySelector('[data-history-range="day"]').getAttribute('aria-pressed')==='true','range lost');assert(root.querySelector('.history-mode').value==='price','metric lost');assert(root.querySelector('[data-history-time]').getAttribute('datetime')===selected,'point lost');});
 await test('Loading state retains labeled ownership signals without invented values',()=>{show('loading');assert(root.querySelector('#report-panel-chart').textContent.includes('Getting price history'),'chart loading state missing');for(const key of ['holders-details','insider-details','bundler-details'])assert(root.querySelector('[data-view-key="'+key+'"] summary').textContent.includes('Checking'),'pending ownership signal missing');assert(root.querySelector('[data-view-key="sniper-details"] summary').textContent.includes('Unavailable'),'unconnected sniper data shown as loading');assert(!root.querySelector('.risk.lower'),'pending risk shown as clear');});
 await test('Unavailable sources stay unassessed while the report remains usable',()=>{show('unavailable');assert(root.querySelector('.quick-risk').textContent.includes('Not assessed'),'unavailable risk assessed');assert(root.querySelector('[data-view-key="holders-details"] summary').textContent.includes('Unavailable'),'holder state missing');assert(root.querySelector('[data-view-key="project-details"]'),'secondary information disappeared');});
 await test('EVM reports omit Solana-only insider, bundle and sniper signals',()=>{show('evm');for(const key of ['insider-details','bundler-details','sniper-details'])assert(!root.querySelector('[data-view-key="'+key+'"]'),'EVM signal rendered: '+key);assert(root.querySelector('.coin-subline').textContent.includes('Base'),'network identity incorrect');});
 await test('Long coin name does not cause horizontal document overflow',async()=>{show('long');await paint();assert(document.documentElement.scrollWidth<=document.documentElement.clientWidth+1,'long-name report overflows the viewport');});
 await test('Standalone report rendering, responsive layout and chart mounting work without a checker session',()=>{const detached=document.createElement('div');detached.innerHTML=resultHTML(clone(ready));detached.className='checker';detached.style.cssText='position:absolute;left:-10000px;width:390px';document.body.append(detached);const stopLayout=mountReportLayout(detached),stop=mountHistoryChart(detached.querySelector('.price-history'),ready.history.data,{range:'all',selected:null},ready.market.data);assert(detached.querySelector('[data-history-engine=lightweight] canvas'),'standalone chart missing');assert(detached.querySelectorAll('.live-security').length===1,'standalone signals duplicated');const mobile=matchMedia('(max-width:800px)').matches;assert(detached.querySelector('.live-security').parentElement===detached.querySelector(mobile?'.mobile-risk-signals':'.report-key-data'),'standalone responsive layout missing');stop();stopLayout();detached.remove();});
 await test('Only the injected local lookup was used',()=>assert(lookupCalls===1,'unexpected lookup count'));
 show('ready');await paint();document.activeElement?.blur();scrollTo(0,0);document.title='Sample coin report · no live data';
 publish({tests:{passed:results.filter(r=>r.ok).length,failed:results.filter(r=>!r.ok).length,results}});measure();
 document.documentElement.dataset.testsComplete='true';document.documentElement.dataset.testFailures=String(results.filter(r=>!r.ok).length);
 window.addEventListener('message',async event=>{if(event.origin!==location.origin||event.source!==parent||event.data?.source!=='coin-layout-review')return;if(event.data.scenario){show(event.data.scenario);await paint();report()?.scrollIntoView({block:'start'});}if(event.data.action==='update'){const updated=clone(current);if(updated.market.data)updated.market.data.retrievedAt+=1000;emit(updated);}if(event.data.action==='report')report()?.scrollIntoView({block:'start'});if(event.data.action==='top')scrollTo(0,0);await paint();measure();});
 window.addEventListener('resize',()=>requestAnimationFrame(measure));
 window.addEventListener('pagehide',dispose,{once:true});
}
</script>
</body>
</html>
