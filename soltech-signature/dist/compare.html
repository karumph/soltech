<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <title>Soltech · Compare versions</title>
 <style>
  *{box-sizing:border-box}body{margin:0;background:#edf0f5;color:#232938;font:15px/1.5 'Segoe UI',system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:18px;max-width:1420px;padding:20px 28px;margin:auto}h1{font-size:18px;letter-spacing:-.03em;margin:0}header p{font-size:13px;color:#5e687b;margin:2px 0 0}nav{display:flex;gap:6px;padding:4px;background:#dfe4ed;border-radius:12px}button{font:inherit;font-size:14px;padding:10px 16px;min-height:44px;border:0;border-radius:9px;background:none;cursor:pointer;color:inherit}button[aria-pressed=true]{background:white;box-shadow:0 1px 4px #28395414}a{color:#455783;text-underline-offset:3px}button:focus-visible,a:focus-visible{outline:3px solid #435c9a;outline-offset:3px}.versions{display:flex;justify-content:center;align-items:start;gap:30px;padding:0 24px 24px}.version{width:390px;max-width:100%;min-width:0}.version-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 5px 10px}h2{margin:0;font-size:14px;font-weight:650}.version-head a{font-size:12px;min-height:32px;display:flex;align-items:center}iframe{display:block;width:100%;height:min(844px,calc(100dvh - 140px));min-height:440px;border:1px solid #cbd3df;border-radius:25px;background:#fff;box-shadow:0 12px 35px #33445e12}.web .versions{display:block;max-width:1480px;margin:auto}.web .version{width:100%}.web .version:not(.selected){display:none}.web iframe{height:calc(100dvh - 140px);border-radius:12px}#web-selection{display:none}.web #web-selection{display:flex}.controls{display:flex;gap:15px;flex-wrap:wrap}.note{font-size:12px;color:#636c7c}@media(max-width:880px){header{padding:16px;flex-wrap:wrap}.versions{gap:16px;padding-inline:16px;justify-content:start;overflow-x:auto}.version{flex:0 0 min(390px,calc(100vw - 32px));}iframe{min-height:380px}.web .version{width:100%}.controls{gap:8px}.version-head{margin-inline:0}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
 </style>
</head>
<body>
 <header><div><h1>Two directions. Your choice.</h1><p>Original layout is the chosen direction, now with glass accents. The exploratory copy is unfinished and has separate saved work.</p></div><div class="controls"><nav aria-label="Preview size"><button data-size="phone" aria-pressed="true">Phone</button><button data-size="web" aria-pressed="false">Web</button></nav><nav id="web-selection" aria-label="Version"><button data-version="original" aria-pressed="false">Original</button><button data-version="signature" aria-pressed="true">New direction</button></nav></div></header>
 <main class="versions"><section class="version" data-panel="original"><div class="version-head"><h2>Original</h2><a href="http://127.0.0.1:4175/index.html#check" target="_blank" rel="noopener">Open separately</a></div><iframe src="http://127.0.0.1:4175/index.html#check" title="Original Soltech"></iframe></section><section class="version selected" data-panel="signature"><div class="version-head"><h2>New direction</h2><a href="/index.html#check" target="_blank" rel="noopener">Open separately</a></div><iframe src="/index.html#check" title="Soltech signature comparison"></iframe></section></main>
 <script>
  document.querySelectorAll('[data-size]').forEach(button=>button.addEventListener('click',()=>{document.body.classList.toggle('web',button.dataset.size==='web');document.querySelectorAll('[data-size]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));}));
  document.querySelectorAll('[data-version]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-version]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));document.querySelectorAll('[data-panel]').forEach(panel=>panel.classList.toggle('selected',panel.dataset.panel===button.dataset.version));}));
 </script>
</body>
</html>
